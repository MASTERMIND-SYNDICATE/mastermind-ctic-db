###############################################################################
# Open-CTIC CI Pipeline
#
# Runs on every push and pull request to main.
#
# Jobs:
#   lint       — Lint Python ETL code with ruff
#   sql-check  — Validate SQL syntax with pg_query_go (sqlcheck)
#   build      — Build Docker images to verify Dockerfile correctness
###############################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Python Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r etl/requirements.txt

      - name: Ruff check
        run: ruff check etl/

      - name: Ruff format check
        run: ruff format --check etl/

  # ---------------------------------------------------------------------------
  # SQL Syntax Validation
  # ---------------------------------------------------------------------------
  sql-check:
    name: Validate SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ctic
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: cticdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ctic -d cticdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema
        run: psql -h localhost -U ctic -d cticdb -f schema/001_init.sql
        env:
          PGPASSWORD: ci_test_password

      - name: Load seed data
        run: psql -h localhost -U ctic -d cticdb -f schema/002_seed.sql
        env:
          PGPASSWORD: ci_test_password

      - name: Run query files
        run: |
          for f in queries/*.sql; do
            echo "--- Validating $f ---"
            psql -h localhost -U ctic -d cticdb -f "$f"
          done
        env:
          PGPASSWORD: ci_test_password

  # ---------------------------------------------------------------------------
  # Docker Build
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ETL image
        run: docker build -f infra/Dockerfile.etl -t ctic-etl:ci .

      - name: Verify ETL image runs
        run: docker run --rm ctic-etl:ci python -c "import etl; print('ETL package OK')"
